<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NoticeGuard Portal</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
        body { background-color: #1a365d; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
        .card { background: #ffffff; border-radius: 24px; padding: 40px 32px; width: 100%; max-width: 480px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); text-align: center; }
        h1 { color: #0d1b2a; font-size: 28px; font-weight: 800; margin: 0 0 6px 0; }
        .subtitle { color: #6c757d; font-size: 14px; margin-bottom: 24px; }
        .info-box { background-color: #eef2ff; border-radius: 12px; padding: 16px; text-align: left; margin-bottom: 24px; border: 1px solid #e0e7ff; }
        .info-header { font-size: 12px; font-weight: 700; color: #1e1b4b; letter-spacing: 0.5px; margin-bottom: 12px; text-transform: uppercase; }
        .info-list { margin: 0; padding-left: 20px; font-size: 13px; color: #334155; }
        .info-list li { margin-bottom: 8px; }
        .highlight-badge { background-color: #4f46e5; color: white; padding: 4px 8px; border-radius: 6px; font-weight: 600; }
        .info-list a { color: #4f46e5; text-decoration: underline; }
        .form-group { text-align: left; margin-bottom: 18px; }
        label { display: block; font-size: 12px; font-weight: 700; color: #475569; margin-bottom: 8px; letter-spacing: 0.5px; text-transform: uppercase; }
        input { width: 100%; padding: 14px 16px; border: 1px solid #cbd5e1; border-radius: 12px; font-size: 14px; color: #1e293b; outline: none; transition: border-color 0.2s; }
        input::placeholder { color: #94a3b8; }
        input:focus { border-color: #4f46e5; }
        .submit-btn { width: 100%; background-color: #4f46e5; color: white; border: none; border-radius: 12px; padding: 16px; font-size: 16px; font-weight: 700; cursor: pointer; margin-top: 10px; transition: background-color 0.2s; }
        .submit-btn:hover { background-color: #4338ca; }
    </style>
</head>
<body>

<div class="card">
    <h1>NoticeGuard Portal</h1>
    <div class="subtitle">Real-time AI Exam Intelligence & Alert System</div>

    <div class="info-box">
        <div class="info-header">QUICK SETUP FOR TELEGRAM ALERTS:</div>
        <ol class="info-list">
            <li><span class="highlight-badge">Open @NoticeGuardBot & Press /start</span></li>
            <li>Find your Chat ID via <a href="https://t.me/userinfobot" target="_blank">@userinfobot</a></li>
        </ol>
    </div>

    <form action="/select-exams" method="GET">
        <div class="form-group">
            <label>Full Name</label>
            <input type="text" name="name" placeholder="e.g. Enter your name" required>
        </div>

        <div class="form-group">
            <label>Gmail Address</label>
            <input type="email" name="email" placeholder="aspirant@gmail.com" required>
        </div>

        <div class="form-group">
            <label>Telegram Chat ID</label>
            <input type="text" name="chat_id" value="860895408" placeholder="e.g. 860895408" required>
        </div>

        <button type="submit" class="submit-btn">Continue to Exam Selection</button>
    </form>
</div>

</body>
</html>
